server:
  port: 8080

spring:
  application:
    name: cqrs-event-store-demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cqrs_demo}
    username: ${DB_USERNAME:cqrs}
    password: ${DB_PASSWORD:cqrs_local_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  projection:
    synchronous: true
