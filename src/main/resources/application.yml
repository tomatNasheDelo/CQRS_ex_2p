server:
  port: 8080

spring:
  application:
    name: cqrs-event-store-demo
  datasource:
    url: jdbc:h2:file:./data/cqrs-demo;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  projection:
    synchronous: true
