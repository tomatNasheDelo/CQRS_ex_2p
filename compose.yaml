services:
  postgres:
    image: postgres:17-alpine
    container_name: cqrs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cqrs_demo
      POSTGRES_USER: cqrs
      POSTGRES_PASSWORD: cqrs_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cqrs -d cqrs_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
